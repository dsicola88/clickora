# Clickora — stack local (Postgres + Redis). Nunca Railway.
# Uso: docker compose up -d
# Depois (com DATABASE_URL local — ver scripts/local-staging.env.example):
#   set -a && source scripts/local-staging.env && set +a
#   npm run api:db:migrate:deploy && npm run api:db:seed
# Nota: 5433 costuma estar ocupada por outros Postgres; usamos 5434.

services:
  postgres:
    image: postgres:16
    container_name: clickora-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: clickora
      POSTGRES_PASSWORD: clickora
      POSTGRES_DB: clickora
    volumes:
      - clickora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clickora -d clickora"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clickora-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  clickora_pgdata:
