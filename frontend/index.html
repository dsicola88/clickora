<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="dclickora" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (function () {
        try {
          var p = location.pathname || "";
          var host = (location.hostname || "").toLowerCase();
          var isPresell = /^\/p\/[^/]+/.test(p);
          var isMainHost =
            host === "dclickora.com" ||
            host === "www.dclickora.com" ||
            host === "localhost" ||
            host === "127.0.0.1" ||
            /\.vercel\.app$/.test(host);
          // Landers e domínios de assinantes: noindex imediato (antes do React / bots sem JS).
          if (isPresell || !isMainHost) {
            var robotsEl = document.querySelector('meta[name="robots"]');
            if (robotsEl) robotsEl.setAttribute("content", "noindex, nofollow");
            else {
              robotsEl = document.createElement("meta");
              robotsEl.setAttribute("name", "robots");
              robotsEl.setAttribute("content", "noindex, nofollow");
              document.head.appendChild(robotsEl);
            }
            var googlebot = document.querySelector('meta[name="googlebot"]');
            if (!googlebot) {
              googlebot = document.createElement("meta");
              googlebot.setAttribute("name", "googlebot");
              document.head.appendChild(googlebot);
            }
            googlebot.setAttribute("content", "noindex, nofollow");
          }
          // Fontes só na app — em /p/ bloqueiam LCP; landers usam stack do sistema.
          if (!isPresell && isMainHost) {
            var pre1 = document.createElement("link");
            pre1.rel = "preconnect";
            pre1.href = "https://fonts.googleapis.com";
            document.head.appendChild(pre1);
            var pre2 = document.createElement("link");
            pre2.rel = "preconnect";
            pre2.href = "https://fonts.gstatic.com";
            pre2.crossOrigin = "anonymous";
            document.head.appendChild(pre2);
            var fontCss = document.createElement("link");
            fontCss.rel = "stylesheet";
            fontCss.href =
              "https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;1,400&family=DM+Serif+Display:ital@0;1&display=swap";
            document.head.appendChild(fontCss);
          }
          if (isPresell || !isMainHost) {
            document.title = "\u00A0";
            document
              .querySelectorAll('link[rel="icon"], link[rel="shortcut icon"], link[rel="apple-touch-icon"]')
              .forEach(function (el) {
                el.parentNode && el.parentNode.removeChild(el);
              });
            var appTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (appTitle && appTitle.parentNode) appTitle.parentNode.removeChild(appTitle);
            document
              .querySelectorAll(
                'meta[name="description"], meta[property="og:title"], meta[property="og:description"], meta[name="twitter:title"], meta[name="twitter:description"]',
              )
              .forEach(function (el) {
                el.setAttribute("content", "");
              });
            try {
              if (isPresell && host !== "localhost" && host !== "127.0.0.1") {
                var seg = "";
                try {
                  seg = decodeURIComponent((p.split("/")[2] || "").replace(/\/+$/, ""));
                } catch (e2) {
                  seg = (p.split("/")[2] || "").replace(/\/+$/, "");
                }
                if (seg) {
                  var isUuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(seg);
                  var apiPath = isUuid
                    ? "/api/public/presells/id/" + encodeURIComponent(seg)
                    : "/api/public/presells/slug/" + encodeURIComponent(seg);
                  window.__clickoraPresellEarly = {
                    param: seg,
                    promise: fetch(apiPath, {
                      credentials: "omit",
                      headers: { Accept: "application/json" },
                    })
                      .then(function (r) {
                        return r.ok ? r.json() : null;
                      })
                      .catch(function () {
                        return null;
                      }),
                  };
                }
              }
            } catch (e3) {}
            document
              .querySelectorAll('meta[property="og:image"], meta[name="twitter:image"]')
              .forEach(function (el) {
                el.parentNode && el.parentNode.removeChild(el);
              });
            var st = document.createElement("style");
            st.setAttribute("data-presell-shell", "1");
            st.textContent =
              "html,body{margin:0;min-height:100%;max-width:100%;overflow-x:hidden;background-color:hsl(40 33% 98%);-webkit-text-size-adjust:100%;text-size-adjust:100%;}" +
              "#root{min-height:100%;max-width:100vw;overflow-x:hidden;}";
            document.head.appendChild(st);
          }
        } catch (e) {}
      })();
    </script>
    <title>dclickora — Super Presell, Tracking e Rastreamento de Conversões para Afiliados</title>
    <meta name="description" content="Crie super presell e páginas presell que convertem, com tracking e rastreamento de cliques, leads e vendas. Ferramenta de afiliados com links rastreados, UTMs e relatórios em tempo real." />
    <meta name="keywords" content="super presell, presell, tracking, rastreamento, rastreamento de conversões, click tracker, ferramenta para afiliados, links rastreados, UTM, postback, media buyer" />
    <meta name="author" content="dclickora" />
    <meta property="og:title" content="dclickora — Super Presell, Tracking e Rastreamento de Conversões para Afiliados" />
    <meta property="og:description" content="Crie super presell e páginas presell que convertem, com tracking e rastreamento de cliques, leads e vendas. Ferramenta de afiliados com links rastreados, UTMs e relatórios em tempo real." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="dclickora" />
    <meta property="og:image" content="/placeholder.svg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="dclickora — Super Presell, Tracking e Rastreamento de Conversões para Afiliados" />
    <meta name="twitter:description" content="Crie super presell e páginas presell que convertem, com tracking e rastreamento de cliques, leads e vendas. Ferramenta de afiliados com links rastreados, UTMs e relatórios em tempo real." />
    <meta name="twitter:image" content="/placeholder.svg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
