<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="dclickora" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (function () {
        try {
          var p = location.pathname || "";
          var isPresell = /^\/p\/[^/]+/.test(p);
          // Fontes só na app — em /p/ bloqueiam LCP; landers usam stack do sistema.
          if (!isPresell) {
            var pre1 = document.createElement("link");
            pre1.rel = "preconnect";
            pre1.href = "https://fonts.googleapis.com";
            document.head.appendChild(pre1);
            var pre2 = document.createElement("link");
            pre2.rel = "preconnect";
            pre2.href = "https://fonts.gstatic.com";
            pre2.crossOrigin = "anonymous";
            document.head.appendChild(pre2);
            var fontCss = document.createElement("link");
            fontCss.rel = "stylesheet";
            fontCss.href =
              "https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;1,400&family=DM+Serif+Display:ital@0;1&display=swap";
            document.head.appendChild(fontCss);
          }
          if (isPresell) {
            document.title = "\u00A0";
            document
              .querySelectorAll('link[rel="icon"], link[rel="shortcut icon"], link[rel="apple-touch-icon"]')
              .forEach(function (el) {
                el.parentNode && el.parentNode.removeChild(el);
              });
            var appTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (appTitle && appTitle.parentNode) appTitle.parentNode.removeChild(appTitle);
            try {
              var host = location.hostname;
              if (host !== "localhost" && host !== "127.0.0.1") {
                var seg = "";
                try {
                  seg = decodeURIComponent((p.split("/")[2] || "").replace(/\/+$/, ""));
                } catch (e2) {
                  seg = (p.split("/")[2] || "").replace(/\/+$/, "");
                }
                if (seg) {
                  var isUuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(seg);
                  var apiPath = isUuid
                    ? "/api/public/presells/id/" + encodeURIComponent(seg)
                    : "/api/public/presells/slug/" + encodeURIComponent(seg);
                  window.__clickoraPresellEarly = {
                    param: seg,
                    promise: fetch(apiPath, {
                      credentials: "omit",
                      headers: { Accept: "application/json" },
                    })
                      .then(function (r) {
                        return r.ok ? r.json() : null;
                      })
                      .catch(function () {
                        return null;
                      }),
                  };
                }
              }
            } catch (e3) {}
            document
              .querySelectorAll('meta[property="og:image"], meta[name="twitter:image"]')
              .forEach(function (el) {
                el.parentNode && el.parentNode.removeChild(el);
              });
            var st = document.createElement("style");
            st.setAttribute("data-presell-shell", "1");
            st.textContent =
              "html,body{margin:0;min-height:100%;max-width:100%;overflow-x:hidden;background-color:hsl(40 33% 98%);-webkit-text-size-adjust:100%;text-size-adjust:100%;}" +
              "#root{min-height:100%;max-width:100vw;overflow-x:hidden;}";
            document.head.appendChild(st);
          }
        } catch (e) {}
      })();
    </script>
    <title>dclickora — Presell pages, rastreamento de conversões e ferramenta para afiliados</title>
    <meta name="description" content="Crie presell pages profissionais, rastreie cliques, leads e vendas com links rastreados. Plataforma de tracking, conversões e gestão de URLs para marketing de afiliados digitais." />
    <meta name="author" content="dclickora" />
    <meta property="og:title" content="dclickora — Presell pages, rastreamento de conversões e ferramenta para afiliados" />
    <meta property="og:description" content="Crie presell pages profissionais, rastreie cliques, leads e vendas com links rastreados. Plataforma de tracking, conversões e gestão de URLs para marketing de afiliados digitais." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/placeholder.svg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="dclickora — Presell pages, rastreamento de conversões e ferramenta para afiliados" />
    <meta name="twitter:description" content="Crie presell pages profissionais, rastreie cliques, leads e vendas com links rastreados. Plataforma de tracking, conversões e gestão de URLs para marketing de afiliados digitais." />
    <meta name="twitter:image" content="/placeholder.svg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
